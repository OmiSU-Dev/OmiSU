# OmiSu — AI agent backend configuration.
#
# GitHub monorepo for shipping heal fixes:
#   https://github.com/OmiSU-Dev/OmiSU
# Runtime source path in repo: omarchy-quattro/  (= /usr/share/omisu on disk)
#
# Target machine auth (preferred over deploy keys for OpenCode):
#   1. Create fine-grained PAT: https://github.com/settings/personal-access-tokens/new
#      Repo: OmiSU-Dev/OmiSU only | Contents + Pull requests: Read and write
#   2. Run: bash dev/setup-github-token.sh
#   3. OpenCode / agents: export GITHUB_TOKEN="$(gh auth token)"
#
# See default/agents/skills/omisu/contributing.md for the bare-metal ship protocol.
#
# Pick the agent that powers `omisu-heal` / `omisu-agents` / `omisu-agent`.
# One of: claude | codex | opencode | gemini | ollama | herder | <any command on PATH>
#
# The easiest way to set this is the picker, which installs the CLI if missing
# and writes OMISU_AGENT below (Super+Shift+Ctrl+A, or the agents menu):
#   omisu-default-agent --pick
#   omisu-default-agent opencode     # install + set a specific agent
OMISU_AGENT="${OMISU_AGENT:-claude}"

# Extra flags passed when omisu-heal launches the agent. Example:
#   claude:  "--dangerously-skip-permissions"
#   codex:   "--approval-mode proposed"
#   ollama:  "-m qwen2.5-coder:32b"
OMISU_AGENT_FLAGS=""

# Passive self-healing: set to 1 to allow `omisu-heal --watch` to auto-fix
# detected breakage WITHOUT user interaction. Default off — by default YOU
# drive the agent (run omisu-heal manually to report an issue or ask for help).
OMISU_HEAL_PASSIVE="${OMISU_HEAL_PASSIVE:-0}"

# How often (seconds) the watch loop checks for breakage.
OMISU_HEAL_INTERVAL="${OMISU_HEAL_INTERVAL:-300}"
