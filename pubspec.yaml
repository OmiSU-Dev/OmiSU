name: omisu
description: OmiSU - Omakase Frontend Emulations

publish_to: "none" # Remove this line if you wish to publish to pub.dev

workspace:
  - packages/flutter_7zip
  - packages/flutter_chd
  - packages/gamepads
  - packages/gamepads_android
  - packages/gamepads_darwin
  - packages/gamepads_linux
  - packages/gamepads_platform_interface
  - packages/gamepads_windows

version: 0.13.0+142

environment:
  sdk: '>=3.9.2'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  gamepads:
    path: packages/gamepads
  flutter_7zip:
    path: packages/flutter_7zip
  flutter_chd:
    path: packages/flutter_chd

  file_picker: ^13.1.0
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  google_fonts: ^8.2.1
  material_symbols_icons: ^4.2960.0
  provider: ^6.1.5+1
  battery_plus: ^7.1.1
  path: ^1.9.1
  path_provider: ^2.1.6
  xml: ^7.0.1
  video_player: ^2.14.0
  fvp: ^0.38.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  http: ^1.6.0
  flutter_svg: ^2.3.0
  crypto: ^3.0.7
  archive: ^4.3.0
  web_socket_channel: ^3.0.3
  url_launcher: ^6.3.2
  widget_mask: ^1.0.0
  flutter_screenutil: 5.9.3
  window_manager: ^0.5.2
  permission_handler: ^13.0.2
  pointycastle: ^4.0.0
  sqlite3: ^3.6.0
  fullscreen_window: ^1.2.1
  animated_toggle_switch: ^0.8.7
  marquee: ^2.3.0
  logger: ^2.8.0
  sub_screen: ^0.1.9
  flutter_soloud: ^5.1.2
  audio_metadata_reader: ^1.8.0
  wakelock_plus: ^1.8.0
  flutter_localization: ^0.4.1
  flutter_tilt: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  ffigen: ^22.0.0

# Transitive bumps blocked by Flutter SDK / plugin caps (see `flutter pub outdated`).
dependency_overrides:
  cli_util: ^0.6.0
  dbus: ^0.8.0
  material_color_utilities: ^0.13.1
  test_api: ^0.7.14

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "assets/images/logo-background.png"
  adaptive_icon_foreground: "assets/images/logo-foreground.png"
  adaptive_icon_monochrome: "assets/images/logo-monochrome.png"
  adaptive_icon_foreground_inset: 20
  min_sdk_android: 21 # android min sdk min:16, default 21 
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"
  linux:
    generate: true
    image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  fonts:
    - family: JetBrainsMonoNerdFont
      fonts:
        - asset: assets/fonts/JetBrainsMonoNerdFont/JetBrainsMonoNerdFont-Regular.ttf
        - asset: assets/fonts/JetBrainsMonoNerdFont/JetBrainsMonoNerdFont-Bold.ttf
          weight: 700
  assets:
    - assets/images/
    - assets/images/logos/
    - assets/images/emulators/
    - assets/images/gamepad/
    - assets/images/icons/
    - assets/images/music/
    - assets/manifest.json
    - assets/data/
    - assets/ascii/
    - assets/systems/
    - assets/sounds/
  shaders:
    - assets/shaders/stripes.frag
    - assets/shaders/fluid.frag
    - assets/shaders/gif_player.frag
    - assets/shaders/music_visualizer.frag
    - assets/shaders/music_card_background.frag