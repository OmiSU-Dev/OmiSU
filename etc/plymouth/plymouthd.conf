[Daemon]
Theme=omisu
# Plymouth ignores the EFI/simpledrm framebuffer unless this is set, then
# waits DeviceTimeout seconds for a "real" GPU module and falls back to the
# text LUKS prompt. QEMU/OVMF and many firmware-only boots never pack that
# module (kms/autodetect sees built-in simpledrm). Omarchy laptops avoid
# this because kms packs i915/amdgpu; the theme/hook/cmdline path is the same.
UseSimpledrm=true
