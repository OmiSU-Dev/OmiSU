# QEMU/OVMF and other virtio-vga systems need virtio_gpu in the UKI or
# Plymouth has no DRM device at LUKS unlock. The live ISO splash works
# because archiso kms packs every DRM driver; the installed UKI uses
# autodetect+kms and often sees only built-in simpledrm, so virtio_gpu
# is never loaded and never packed.
#
# Optional '?': skip on machines without the module (built-in, or no virtio
# GPU in the kernel tree). Never list simpledrm here — it is built-in and a
# required MODULE hard-fails mkinitcpio / limine-update.
# virtio-gpu depends on virtio_dma_buf; pack both for QEMU/OVMF virtio-vga.
MODULES+=(virtio_dma_buf? virtio_gpu?)
